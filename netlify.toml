[build]
  command = "npm run build"
  publish = "build/client"

[build.environment]
  NODE_VERSION = "24"
  PORTFOLIO_CONTENT_SOURCE = "sanity"
  SANITY_PROJECT_ID = "wo8xbxgq"
  SANITY_DATASET = "production"
  # These values identify public content; they are not authentication secrets.
  SECRETS_SCAN_OMIT_KEYS = "PORTFOLIO_CONTENT_SOURCE,SANITY_PROJECT_ID,SANITY_DATASET"

# Existing generated files take precedence. Unknown or unpublished routes return 404.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/content-snapshot.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
